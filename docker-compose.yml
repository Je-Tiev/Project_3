version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: project3db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      retries: 5

  backend:
    build: ./BE/Paperless_Meeting
    ports:
      - "5000:5000"  #XOÁ SAU KHI XONG
    environment:
      - ASPNETCORE_ENVIRONMENT=Development #Sau khi xong => Production
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=project3db;Username=postgres;Password=${DB_PASSWORD};SSL Mode=Require;Trust Server Certificate=true
    volumes:  #Thêm
      - aspnet_keys:/root/.aspnet/DataProtection-Keys
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  aspnet_keys:  #Thêm
