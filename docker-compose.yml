services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paperless_meeting}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./BE/Paperless_Meeting
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${POSTGRES_DB:-paperless_meeting};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres};SSL Mode=Prefer
      - Jwt__Key=${JWT_SECRET_KEY:-DEV_JWT_SECRET_KEY_CHANGE_IN_PRODUCTION_ENV_MIN_32_BYTES_LONG}
      - Jwt__Issuer=${JWT_ISSUER:-PaperlessMeetingBackend}
      - Jwt__Audience=${JWT_AUDIENCE:-PaperlessMeetingFrontend}
      - Storage__UploadPath=/app/Uploads
    volumes:
      - backend_uploads:/app/Uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./FE
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads:
