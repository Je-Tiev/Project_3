version: "3.8"
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: project3db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      retries: 5

  backend:
    build: ./BE/Paperless_Meeting
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=project3db;Username=postgres;Password=${DB_PASSWORD};SSL Mode=Disable
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./FE/FE
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_URL=http://backend:5000/api
      # Khi deploy web lên server cần sửa
      # - REACT_APP_HUB_URL=https://meeting.ngocmx.com/meetinghub
      # - REACT_APP_API_URL=http://meeting.ngocmx.com/api
    depends_on:
      - backend

volumes:
  postgres_data:
