services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paperless_meeting}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-paperless_admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-paperless_minio_secret_2026}
    volumes:
      - minio_data:/data

  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49152-49160:49152-49160/udp"
    command:
      - turnserver
      - --log-file=stdout
      - --listening-port=3478
      - --min-port=49152
      - --max-port=49160
      - --user=paperless:meeting2026secret
      - --realm=paperless.meeting
      - --lt-cred-mech
      - --fingerprint

  backend:
    build:
      context: ./BE/Paperless_Meeting
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${POSTGRES_DB:-paperless_meeting};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres};SSL Mode=Prefer
      - ConnectionStrings__Redis=redis:6379
      - Jwt__Key=${JWT_SECRET_KEY:-DEV_JWT_SECRET_KEY_CHANGE_IN_PRODUCTION_ENV_MIN_32_BYTES_LONG}
      - Jwt__Issuer=${JWT_ISSUER:-PaperlessMeetingBackend}
      - Jwt__Audience=${JWT_AUDIENCE:-PaperlessMeetingFrontend}
      - Storage__UploadPath=/app/Uploads
      - Webrtc__TurnServer=turn:127.0.0.1:3478
      - Webrtc__TurnUsername=paperless
      - Webrtc__TurnPassword=meeting2026secret
    volumes:
      - backend_uploads:/app/Uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./FE
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  minio_data:
  backend_uploads:
